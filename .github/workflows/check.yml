name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task:
          - check:specs
          - check:graphql-js
          - check:vectors
          - check:differentials
          - check:mutants
    name: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:fixtures
      - run: npm run ${{ matrix.task }}
      - name: Generated TLA+ is up to date
        run: git diff --exit-code -- specs/

# Errors and nulls propagate to the nearest nullable position (§6.4.4).
# maxListLength: 0
# spec: 3.12, 6.4.4, 6.3.3

type Query {
  version: String!
  user: User
}

type User {
  id: ID!
  name: String
  bestFriend: User!
}

query {
  version
  user {
    id
    name
    bestFriend {
      id
    }
  }
}

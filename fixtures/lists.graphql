# List items complete in parallel (§6.4.3). An error in a Non-Null item
# nulls the whole list, and a nullable item absorbs its own error.
# maxListLength: 2
# spec: 3.11, 3.12.1, 6.4.3, 6.4.4

type Query {
  posts: [Post!]
  tags: [String]!
}

type Post {
  title: String!
}

query {
  posts {
    title
  }
  tags
}
